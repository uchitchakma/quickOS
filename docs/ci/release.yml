name: quickOS Multi-Platform Cloud Builder & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GTK & WebKit Dependencies (Ubuntu Only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Webview Frontend
        run: npm run build

      - name: Build Native Binary & Package Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'quickOS ${{ github.ref_name }} — Universal Diagnostics Suite'
          releaseBody: |
            ### ⚡ quickOS Universal System & Hardware Diagnostics Suite
            **Company:** UCDREAMS TECHNOLOGIES LLP ([ucdreams.com](https://ucdreams.com))
            **Developer:** Uchit Chakma ([uchitchakma.com](https://uchitchakma.com))

            ---
            #### 📦 Download Packages by Operating System:
            * ** macOS (Apple Silicon & Intel):** Download the `.dmg` installer.
            * **⊞ Windows 10 / 11:** Download the `.msi` or `.exe` setup package.
            * **🐧 Linux & Ubuntu:** Download the `.AppImage` (runs on Ubuntu, Debian, Fedora, Arch) or `.deb`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
