[package]
name = "quickos"
version = "1.0.0"
description = "Universal Cross-Platform System & Hardware Diagnostics Suite by UCDREAMS TECHNOLOGIES LLP"
authors = ["Uchit Chakma <uchitchakma.com>", "UCDREAMS TECHNOLOGIES LLP <ucdreams.com>"]
edition = "2021"

[lib]
name = "quickos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
